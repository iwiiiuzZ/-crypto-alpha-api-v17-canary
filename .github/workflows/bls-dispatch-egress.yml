name: Candidate BLS dispatch and real source consumption
on:
  push:
    branches: [integration/bls-relay-clock-20261101]
    paths:
      - .github/workflows/bls-dispatch-egress.yml
      - main-v188.js
      - ops/probe-bls-cloudflare-egress.mjs
      - ops/build-bls-dispatch-probe.mjs
permissions:
  contents: read
  actions: write
concurrency:
  group: crypto-alpha-bls-dispatch-egress-test
  cancel-in-progress: false
jobs:
  pin-test-collector:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Pin known current production collector for isolated compatibility test
        env:
          COLLECTOR_PIN_TOKEN: ${{ github.token }}
        run: node ops/pin-bls-collector.mjs --test-baseline
  dispatch-real-source-check:
    needs: pin-test-collector
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
      EPHEMERAL_ACTIONS_TEST_TOKEN: ${{ github.token }}
      GITHUB_ACTIONS_DISPATCH_TOKEN: ${{ secrets.BLS_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Verify candidate dispatch in temporary isolated Worker; existing official collector refreshes real feeds
        run: node ops/probe-bls-cloudflare-egress.mjs --dispatch-check
      - name: Confirm temporary Worker removed
        if: always()
        run: node ops/probe-bls-cloudflare-egress.mjs --cleanup-only
      - name: Retain real dispatch, receipt and deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLS_DISPATCH_REAL_SOURCE_CONSUMPTION
          path: bls-dispatch-egress-evidence.json
          if-no-files-found: warn
          retention-days: 30
