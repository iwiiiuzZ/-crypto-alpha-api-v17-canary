name: Isolated official BLS Cloudflare egress check
on:
  push:
    branches: [ops/bls-direct-egress-probe-20261101]
    paths: [.github/workflows/bls-isolated-egress.yml]
permissions:
  contents: read
concurrency:
  group: crypto-alpha-bls-isolated-egress
  cancel-in-progress: false
jobs:
  isolated-egress:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Compare original official requests in isolated stateless Worker and remove it
        run: node ops/probe-bls-cloudflare-egress.mjs
      - name: Confirm cleanup even after an interrupted probe
        if: always()
        run: node ops/probe-bls-cloudflare-egress.mjs --cleanup-only
      - name: Preserve source measurements and production identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLS_ISOLATED_CLOUDFLARE_EGRESS
          path: bls-isolated-egress-evidence.json
          if-no-files-found: warn
          retention-days: 30
