name: Install checked deployment gate
on:
  push:
    branches: ['ops/install-build-gate']
    paths: ['ops/configure-build-gate.mjs', 'tests/test-build-gate.mjs', '.github/workflows/build-gate.yml']
permissions:
  contents: read
concurrency:
  group: crypto-alpha-production-maintenance
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node tests/test-build-gate.mjs
      - name: Set only the verified main trigger deploy command and read it back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ops/configure-build-gate.mjs --apply
