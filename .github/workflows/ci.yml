name: CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'integration/**']
permissions:
  contents: read
jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Package exact tested backend, evidence and recovery tools
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/r5-freeze-candidate-20261031' || (github.event_name == 'pull_request' && github.head_ref == 'integration/r5-freeze-candidate-20261031'))
        run: |
          mkdir -p release
          cp main-v188.js wrangler.jsonc package.json package-lock.json GPT_OPENING_V27_6_3_CANDIDATE.txt release/
          cp ./*.md release/
          cp -R ops tests docs evidence test-results .github release/
          rm -rf release/ops/__pycache__
          (cd release && zip -qr ../CryptoAlpha_Backend_Engineering_Acceptance_20261031.zip .)
      - name: Retain tested backend for final acceptance; private GPT assets are separate
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/r5-freeze-candidate-20261031' || (github.event_name == 'pull_request' && github.head_ref == 'integration/r5-freeze-candidate-20261031'))
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlpha_Backend_Engineering_Acceptance_20261031
          path: CryptoAlpha_Backend_Engineering_Acceptance_20261031.zip
          if-no-files-found: error
          retention-days: 30

  readonly-r5-production-preflight:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/integration/r5-freeze-candidate-20261031') || (github.event_name == 'pull_request' && github.head_ref == 'integration/r5-freeze-candidate-20261031' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify candidate baseline or already deployed exact source without mutation
        run: |
          if node --input-type=module -e "import fs from 'node:fs';process.exit(JSON.parse(fs.readFileSync('ops/release-manifest.json','utf8')).status==='DEPLOYED_AWAITING_FINAL_ACCEPTANCE'?0:1)"; then
            node ops/current-release.mjs
          else
            node ops/r5-preflight.mjs
          fi
      - name: Preserve redacted read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R5_READONLY_PREFLIGHT
          path: |
            r5-preflight-evidence.json
            current-release-evidence.json
          if-no-files-found: warn
          retention-days: 30
