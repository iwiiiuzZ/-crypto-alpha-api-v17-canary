name: CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'integration/**']
permissions:
  contents: read
jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Package candidate only after complete regression passes
        if: success() && (github.ref == 'refs/heads/integration/r5-freeze-candidate-20261031' || (github.event_name == 'pull_request' && github.head_ref == 'integration/r5-freeze-candidate-20261031'))
        run: |
          mkdir -p release/ops release/tests
          cp main-v188.js wrangler.jsonc package.json package-lock.json GPT_OPENING_V27_6_3_CANDIDATE.txt V27_6_3_INSTALL_AND_RELEASE.md PROJECT_REQUIREMENTS_AND_ACCEPTANCE.md ACCEPTANCE.md RELEASE_READINESS.md R5_INSTALL_AND_FINAL_GATES.md RESEARCH_AND_VALIDATION_2026-10-30.md USER_ACCEPTANCE.md REGRESSION_SCOPE.md release/
          cp -R ops/. release/ops/
          cp -R tests/. release/tests/
          (cd release && zip -qr ../CryptoAlpha_V27_6_3_R5_CANDIDATE_TESTED.zip .)
      - name: Retain tested candidate for download (not production)
        if: success() && (github.ref == 'refs/heads/integration/r5-freeze-candidate-20261031' || (github.event_name == 'pull_request' && github.head_ref == 'integration/r5-freeze-candidate-20261031'))
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlpha_V27_6_3_R5_CANDIDATE_TESTED
          path: CryptoAlpha_V27_6_3_R5_CANDIDATE_TESTED.zip
          if-no-files-found: error
          retention-days: 30

  readonly-r5-production-preflight:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/integration/r5-freeze-candidate-20261031') || (github.event_name == 'pull_request' && github.head_ref == 'integration/r5-freeze-candidate-20261031' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify immutable candidate against live R4 without modifying production
        run: node ops/r5-preflight.mjs
      - name: Preserve redacted read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R5_READONLY_PREFLIGHT
          path: r5-preflight-evidence.json
          if-no-files-found: warn
          retention-days: 30
