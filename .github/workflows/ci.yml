name: CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'integration/**']
permissions:
  contents: read
jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Package candidate only after complete regression passes
        if: success() && github.ref == 'refs/heads/integration/r3-macro-news-20261030'
        run: |
          mkdir -p release/ops release/tests
          cp main-v188.js wrangler.jsonc package.json package-lock.json GPT_OPENING_V27_6_3_CANDIDATE.txt V27_6_3_INSTALL_AND_RELEASE.md PROJECT_REQUIREMENTS_AND_ACCEPTANCE.md ACCEPTANCE.md RELEASE_READINESS.md release/
          cp -R ops/. release/ops/
          cp -R tests/. release/tests/
          (cd release && zip -qr ../CryptoAlpha_V27_6_3_R4_CANDIDATE_TESTED.zip .)
      - name: Retain tested candidate for download (not production)
        if: success() && github.ref == 'refs/heads/integration/r3-macro-news-20261030'
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlpha_V27_6_3_R4_CANDIDATE_TESTED
          path: CryptoAlpha_V27_6_3_R4_CANDIDATE_TESTED.zip
          if-no-files-found: error
          retention-days: 30
