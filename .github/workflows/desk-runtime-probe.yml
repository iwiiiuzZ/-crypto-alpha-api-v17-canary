name: Desk runtime read-only probe
on:
  push:
    branches: [main]
    paths: ['ops/desk-runtime-probe.mjs']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Read runtime and aggregate error categories
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
        run: node ops/desk-runtime-probe.mjs
