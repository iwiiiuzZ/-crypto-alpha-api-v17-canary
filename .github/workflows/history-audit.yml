name: Historical failure audit
on:
  push:
    branches: ['audit/history-503']
    paths: ['ops/history-audit.mjs', 'tests/test-history-audit.mjs', '.github/workflows/history-audit.yml']
permissions:
  contents: read
jobs:
  historical-read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: node tests/test-history-audit.mjs
      - name: Query only the known failure window
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ops/history-audit.mjs
