name: Shadow public market snapshot capture
on:
  push:
    branches: [ops/macro-runtime-readonly-20261106]
    paths: [.github/workflows/macro-runtime-readonly.yml]
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Capture public snapshot in temporary shadow worker, remove probe and verify production unchanged
        run: node ops/market-shadow-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MARKET_SHADOW_CAPTURE
          path: market-shadow-capture.json
          retention-days: 30
