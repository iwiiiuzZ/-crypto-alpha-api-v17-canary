name: R5 independent runtime evidence only
on:
  push:
    branches: [ops/r5-runtime-diagnostics-20261031]
    paths: [.github/workflows/r5-runtime-readonly.yml]
permissions:
  contents: read
concurrency:
  group: crypto-alpha-r5-independent-readonly
  cancel-in-progress: false
jobs:
  runtime-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Verify exact deployment and new main-branch relay consumption using passive reads only
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {requestJson,summarizeSample,assessSamples,assessNewsReceiptCoverage,cloudflareSnapshot,cloudflareBuildSnapshot,safeOutput} from './ops/diagnostics.mjs';
          const config=JSON.parse(fs.readFileSync('ops/config.json','utf8'));
          const scanner=process.env.SCANNER_TOKEN,token=process.env.CLOUDFLARE_API_TOKEN;
          const samples=[],began=Date.now();
          for(const offset of [0,25000,85000]){
            await new Promise(r=>setTimeout(r,Math.max(0,began+offset-Date.now())));
            const [fast,status]=await Promise.all([
              requestJson(fetch,config.origin+'/?view=fast'),
              requestJson(fetch,config.origin+'/scanner/status',{authorization:'Bearer '+scanner})
            ]);
            samples.push(summarizeSample(fast,status));
          }
          const [cloudflare,buildConfiguration]=await Promise.all([cloudflareSnapshot(fetch,config,token),cloudflareBuildSnapshot(fetch,config,token)]);
          const build='crypto-alpha-worker-v27.6.3-macro-r5f';
          const assessment=assessSamples(samples,{...config,build});
          const requiredNewsCoverage=assessNewsReceiptCoverage(samples.at(-1));
          const bls=['BLS_CPI','BLS_PPI','BLS_EMPLOYMENT','BLS_CALENDAR'];
          const newMainRelayConsumed=bls.every(id=>samples.at(-1).consumedNewsSources.some(s=>s.source===id&&s.status==='ok'&&Date.parse(s.fetchedAt)>=Date.parse('2026-10-31T10:55:00Z')));
          const exactDeployment=cloudflare.deploymentId==='f11b44aa-0e29-4260-8104-c12fef44a68a'&&cloudflare.singleVersion&&cloudflare.versions?.[0]?.id==='f7b3fdd9-0053-4ee0-83a8-4802ba0fc7fe'&&cloudflare.binding?.namespaceFingerprint==='aedfbcd14cd1';
          const passed=assessment.operationalPassed&&requiredNewsCoverage.passed&&newMainRelayConsumed&&exactDeployment;
          const evidence={mode:'PASSIVE_POST_MAIN_BUILD_AND_NEW_RELAY_BATCH_NO_FOREGROUND_REFRESH',mainCommit:'ea07d2ee454c950495bdc1ad574697797b66ae11',observedAt:new Date().toISOString(),samples,cloudflare,buildConfiguration,assessment,requiredNewsCoverage,newMainRelayConsumed,exactDeployment,passed,finalDeliveryAccepted:false};
          const out=safeOutput(evidence,[scanner,token]);fs.writeFileSync('post-main-runtime-evidence.json',out);console.log(out);
          if(!passed)process.exitCode=1;
          NODE
      - name: Preserve passive evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R5_POST_MAIN_PASSIVE_RUNTIME
          path: post-main-runtime-evidence.json
          if-no-files-found: warn
          retention-days: 30
